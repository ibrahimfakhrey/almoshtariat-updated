<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" name="viewport"/>
    <meta content="ie=edge" http-equiv="X-UA-Compatible"/>
    <title>Create New Order - 5-Step Form</title>
    <link href="favicon.ico" rel="icon"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_0.css') }}">
</head>
<body>
    <!-- Main Container -->
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="sidebar fixed top-0 left-0 z-9999 flex h-screen w-[290px] flex-col overflow-y-auto border-r border-gray-200 bg-white px-5 transition-all duration-300 xl:static xl:translate-x-0 dark:border-gray-800 dark:bg-black">
            <!-- Sidebar Header -->
            <div class="sidebar-header flex items-center gap-2 pt-8 pb-7">
                <a href="/">
                    <span class="logo">
                        <img alt="Logo" class="dark:hidden" src="https://img.icons8.com/?size=100&id=XnHBz2LnhELw&format=png&color=000000"/>
                        <img alt="Logo" class="hidden dark:block" src="https://img.icons8.com/?size=100&id=XnHBz2LnhELw&format=png&color=000000"/>
                    </span>
                </a>
            </div>
            
            <!-- Navigation Menu -->
            <nav class="no-scrollbar flex flex-col overflow-y-auto duration-300 ease-linear">
                <div>
                    <h3 class="mb-4 text-xs leading-[20px] text-gray-400 uppercase">MENU</h3>
                    <ul class="mb-6 flex flex-col gap-1">
                        <li>
                            <a href="/dash" class="menu-item group">
                                <span class="menu-item-text">Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="/profile" class="menu-item group">
                                <span class="menu-item-text">User Profile</span>
                            </a>
                        </li>
                        <li>
                            <a href="/orders" class="menu-item group">
                                <span class="menu-item-text">My Orders</span>
                            </a>
                        </li>
                        <li>
                            <a href="/my_deliveries" class="menu-item group">
                                <span class="menu-item-text">My Deliveries</span>
                            </a>
                        </li>
                        <li>
                            <a href="/new_purchase" class="menu-item group menu-item-active">
                                <span class="menu-item-text">Create Order</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="relative flex flex-1 flex-col overflow-hidden xl:ml-[290px]">
            <!-- Header -->
            <header class="sticky top-0 z-999 flex w-full items-center justify-between gap-3 bg-white px-4 py-4 shadow-sm dark:bg-black sm:px-6">
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-semibold text-gray-800 dark:text-white/90">Create New Order</h1>
                </div>
                
                <!-- User Menu -->
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <span class="text-theme-sm mr-1 block font-medium">{{ current_user.username }}</span>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto">
                <div class="mx-auto max-w-4xl p-4 md:p-6">
                    
                    <!-- Progress Bar -->
                    <div class="mb-8">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-semibold text-gray-800 dark:text-white/90">Step 1 of 5</h2>
                            <div class="text-sm text-gray-600 dark:text-gray-400">
                                20% Complete
                            </div>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2 dark:bg-gray-700">
                            <div class="bg-brand-500 h-2 rounded-full transition-all duration-300" style="width: 20%"></div>
                        </div>
                    </div>

                    <!-- Step Navigation Tabs -->
                    <div class="mb-8">
                        <div class="flex space-x-1 bg-gray-100 p-1 rounded-lg dark:bg-gray-800">
                            <button class="flex-1 py-2 px-4 rounded-md text-sm font-medium bg-white text-brand-600 shadow-sm">
                                Order Details
                            </button>
                            <button class="flex-1 py-2 px-4 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900">
                                Products
                            </button>
                            <button class="flex-1 py-2 px-4 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900">
                                Delivery
                            </button>
                            <button class="flex-1 py-2 px-4 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900">
                                Payment
                            </button>
                            <button class="flex-1 py-2 px-4 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900">
                                Settings
                            </button>
                        </div>
                    </div>

                    <!-- Form Container -->
                    <form id="multi-step-form" action="{{ url_for('new_purchase') }}" method="POST" enctype="multipart/form-data" 
                          class="space-y-6">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                        <!-- Panel 1: Order Details -->
                        <div class="space-y-6">
                            <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
                                <div class="px-5 py-4 sm:px-6 sm:py-5">
                                    <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Order Details</h3>
                                </div>
                                <div class="space-y-6 border-t border-gray-100 p-5 sm:p-6 dark:border-gray-800">
                                    
                                    <!-- Order Name -->
                                    <div class="w-full">
                                        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Order Name *</label>
                                        <input type="text" name="order_name" 
                                               placeholder="Enter order name" required 
                                               class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"/>
                                    </div>

                                    <!-- Description -->
                                    <div class="w-full">
                                        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Description</label>
                                        <textarea name="description" 
                                                  placeholder="Enter order description" rows="4"
                                                  class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"></textarea>
                                    </div>

                                    <!-- Sector -->
                                    <div class="w-full">
                                        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Sector *</label>
                                        <select name="sector" required
                                                class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
<option value="Technology">Technology</option>
<option value="Electronics">Electronics</option>
<option value="IT">IT</option>
<option value="Software">Software</option>
<option value="Hardware">Hardware</option>
<option value="General">General</option>
<option value="Other">Other</option>
</select>
                                    </div>

                                    <!-- Order Type -->
                                    <div class="w-full">
                                        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Order Type *</label>
                                        <select name="order_type" required
                                                class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
                                            <option value="">Select Order Type</option>
                                            <option value="direct">Direct</option>
                                            <option value="مناقصة">مناقصة</option>
                                            <option value="طلب تسعير">طلب تسعير</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Navigation Buttons -->
                        <div class="flex justify-between pt-6">
                            <button type="button" 
                                    class="bg-gray-500 hover:bg-gray-600 flex items-center justify-center gap-2 rounded-lg px-6 py-3 text-sm font-medium text-white transition-colors" disabled>
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                                </svg>
                                Previous
                            </button>
                            
                            <div class="flex gap-3">
                                <button type="submit" 
                                        class="bg-green-500 hover:bg-green-600 flex items-center justify-center gap-2 rounded-lg px-6 py-3 text-sm font-medium text-white transition-colors">
                                    Submit Order
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
