<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" name="viewport"/>
    <meta content="ie=edge" http-equiv="X-UA-Compatible"/>
    <title>Add Purchase Preference</title>
    <link href="favicon.ico" rel="icon"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_0.css') }}">
</head>
<body :class="{'dark bg-gray-900': darkMode === true}" x-data="{ page: 'add', 'loaded': true, 'darkMode': false }" x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))">
    
    <!-- ===== Preloader Start ===== -->
    <div class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black" x-init="window.addEventListener('DOMContentLoaded', () => {setTimeout(() => loaded = false, 500)})" x-show="loaded">
        <div class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
        <!-- ===== Content Area Start ===== -->
        <div class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden">
            <!-- ===== Header Start ===== -->
            <header class="sticky top-0 z-99999 flex w-full border-gray-200 bg-white xl:border-b dark:border-gray-800 dark:bg-gray-900">
                <div class="flex grow flex-col items-center justify-between xl:flex-row xl:px-6">
                    <div class="flex w-full items-center justify-between gap-2 border-b border-gray-200 px-3 py-3 sm:gap-4 lg:py-4 xl:justify-normal xl:border-b-0 xl:px-0 dark:border-gray-800">
                        <!-- Logo -->
                        <a href="/" class="flex items-center gap-2">
                            <img alt="Logo" class="h-8 w-8" src="https://img.icons8.com/?size=100&id=XnHBz2LnhELw&format=png&color=000000"/>
                            <span class="text-xl font-bold text-gray-800 dark:text-white">B2B Platform</span>
                        </a>
                        
                        <!-- Navigation -->
                        <nav class="flex items-center gap-4">
                            <a href="/dash" class="text-sm font-medium text-gray-600 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white">Dashboard</a>
                            <a href="/purchase_preferences" class="text-sm font-medium text-gray-600 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white">Preferences</a>
                            <a href="/new_purchase" class="text-sm font-medium text-gray-600 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white">New Purchase</a>
                            <a href="/profile" class="text-sm font-medium text-gray-600 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white">Profile</a>
                        </nav>
                        
                        <!-- Dark Mode Toggle -->
                        <button @click.prevent="darkMode = !darkMode" class="hover:text-dark-900 relative flex h-11 w-11 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white">
                            <svg class="hidden dark:block" fill="none" height="20" viewbox="0 0 20 20" width="20" xmlns="http://www.w3.org/2000/svg">
                                <path clip-rule="evenodd" d="M9.99998 1.5415C10.4142 1.5415 10.75 1.87729 10.75 2.2915V3.5415C10.75 3.95572 10.4142 4.2915 9.99998 4.2915C9.58577 4.2915 9.24998 3.95572 9.24998 3.2915V2.2915C9.24998 1.87729 9.58577 1.5415 9.99998 1.5415ZM10.0009 6.79327C8.22978 6.79327 6.79402 8.22904 6.79402 10.0001C6.79402 11.7712 8.22978 13.207 10.0009 13.207C11.772 13.207 13.2078 11.7712 13.2078 10.0001C13.2078 8.22904 11.772 6.79327 10.0009 6.79327ZM10.0009 14.707C10.4142 14.707 10.7509 15.0438 10.7509 15.458V16.708C10.7509 17.1222 10.4142 17.459 10.0009 17.459C9.58772 17.459 9.25098 17.1222 9.25098 16.708V15.458C9.25098 15.0438 9.58772 14.707 10.0009 14.707ZM16.6676 10.0001C16.6676 9.58588 16.3318 9.2491 15.9176 9.2491H14.6676C14.2534 9.2491 13.9176 9.58588 13.9176 10.0001C13.9176 10.4143 14.2534 10.7511 14.6676 10.7511H15.9176C16.3318 10.7511 16.6676 10.4143 16.6676 10.0001ZM5.41758 10.0001C5.41758 9.58588 5.0818 9.2491 4.66758 9.2491H3.41758C3.00336 9.2491 2.66758 9.58588 2.66758 10.0001C2.66758 10.4143 3.00336 10.7511 3.41758 10.7511H4.66758C5.0818 10.7511 5.41758 10.4143 5.41758 10.0001ZM14.1676 14.1676C14.4726 13.8626 14.4726 13.3876 14.1676 13.0826L13.4176 12.3326C13.1126 12.0276 12.6376 12.0276 12.3326 12.3326C12.0276 12.6376 12.0276 13.1126 12.3326 13.4176L13.0826 14.1676C13.3876 14.4726 13.8626 14.4726 14.1676 14.1676ZM7.66758 7.6676C7.97258 7.3626 7.97258 6.8876 7.66758 6.5826L6.91758 5.8326C6.61258 5.5276 6.13758 5.5276 5.83258 5.8326C5.52758 6.1376 5.52758 6.6126 5.83258 6.9176L6.58258 7.6676C6.88758 7.9726 7.36258 7.9726 7.66758 7.6676ZM14.1676 5.8326C13.8626 6.1376 13.3876 6.1376 13.0826 5.8326L12.3326 5.0826C12.0276 4.7776 12.0276 4.3026 12.3326 3.9976C12.6376 3.6926 13.1126 3.6926 13.4176 3.9976L14.1676 4.7476C14.4726 5.0526 14.4726 5.5276 14.1676 5.8326ZM7.66758 13.4176C7.97258 13.1126 7.97258 12.6376 7.66758 12.3326L6.91758 11.5826C6.61258 11.2776 6.13758 11.2776 5.83258 11.5826C5.52758 11.8876 5.52758 12.3626 5.83258 12.6676L6.58258 13.4176C6.88758 13.7226 7.36258 13.7226 7.66758 13.4176Z" fill="" fill-rule="evenodd"></path>
                            </svg>
                            <svg class="block dark:hidden" fill="none" height="20" viewbox="0 0 20 20" width="20" xmlns="http://www.w3.org/2000/svg">
                                <path clip-rule="evenodd" d="M17.2929 2.29289C17.6834 1.90237 18.3166 1.90237 18.7071 2.29289C19.0976 2.68342 19.0976 3.31658 18.7071 3.70711L17.7071 4.70711C17.3166 5.09763 16.6834 5.09763 16.2929 4.70711C15.9024 4.31658 15.9024 3.68342 16.2929 3.29289L17.2929 2.29289ZM10 6C7.79086 6 6 7.79086 6 10C6 12.2091 7.79086 14 10 14C12.2091 14 14 12.2091 14 10C14 8.68629 12.2091 6 10 6ZM2.29289 2.29289C2.68342 1.90237 3.31658 1.90237 3.70711 2.29289L4.70711 3.29289C5.09763 3.68342 5.09763 4.31658 4.70711 4.70711C4.31658 5.09763 3.68342 5.09763 3.29289 4.70711L2.29289 3.29289C1.90237 3.31658 1.90237 2.68342 2.29289 2.29289ZM2.29289 17.7071C1.90237 17.3166 1.90237 16.6834 2.29289 16.2929L3.29289 15.2929C3.68342 14.9024 4.31658 14.9024 4.70711 15.2929C5.09763 15.6834 5.09763 16.3166 4.70711 16.7071L3.29289 17.7071C3.31658 18.0976 2.68342 18.0976 2.29289 17.7071ZM17.7071 17.7071C17.3166 18.0976 16.6834 18.0976 16.2929 17.7071L15.2929 16.2929C14.9024 16.3166 14.9024 15.6834 15.2929 15.2929C15.6834 14.9024 16.3166 14.9024 16.2929 15.2929L17.7071 16.2929C18.0976 16.6834 18.0976 17.3166 17.7071 17.7071ZM10 18C13.3137 18 16 15.3137 16 12C16 8.68629 13.3137 6 10 6C6.68629 6 4 8.68629 4 12C4 15.3137 6.68629 18 10 18Z" fill="" fill-rule="evenodd"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>
            <!-- ===== Header End ===== -->

            <!-- ===== Main Content Start ===== -->
            <main>
                <div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10">
                    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                        <div>
                            <h2 class="text-title-md2 font-bold text-gray-800 dark:text-white">
                                Add Purchase Preference
                            </h2>
                            <p class="text-sm text-gray-500 dark:text-gray-400">
                                Manually add a new purchase preference to your profile
                            </p>
                        </div>
                        <div class="flex gap-2">
                            <a href="/purchase_preferences" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors dark:text-gray-400 dark:bg-gray-700 dark:hover:bg-gray-600">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                                </svg>
                                Back to Preferences
                            </a>
                        </div>
                    </div>

                    <!-- Add Preference Form -->
                    <div class="rounded-xl border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800">
                        <div class="border-b border-gray-200 px-6 py-4 dark:border-gray-700">
                            <h3 class="text-lg font-semibold text-gray-800 dark:text-white">Preference Details</h3>
                        </div>
                        
                        <div class="p-6">
                            <form method="POST" class="space-y-6">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <!-- Product Name -->
                                    <div class="md:col-span-2">
                                        <label for="product_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Product Name *
                                        </label>
                                        <input type="text" 
                                               id="product_name" 
                                               name="product_name" 
                                               required
                                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                    </div>

                                    <!-- Product Category -->
                                    <div>
                                        <label for="product_category" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Product Category
                                        </label>
                                        <input type="text" 
                                               id="product_category" 
                                               name="product_category" 
                                               placeholder="e.g., Electronics, Tools, etc."
                                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                    </div>

                                    <!-- Unit -->
                                    <div>
                                        <label for="unit" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Unit
                                        </label>
                                        <select id="unit" 
                                                name="unit" 
                                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                            <option value="pcs">Pieces (pcs)</option>
                                            <option value="kg">Kilograms (kg)</option>
                                            <option value="g">Grams (g)</option>
                                            <option value="l">Liters (l)</option>
                                            <option value="ml">Milliliters (ml)</option>
                                            <option value="m">Meters (m)</option>
                                            <option value="cm">Centimeters (cm)</option>
                                            <option value="box">Box</option>
                                            <option value="pack">Pack</option>
                                            <option value="set">Set</option>
                                        </select>
                                    </div>

                                    <!-- Quantity -->
                                    <div>
                                        <label for="quantity" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Typical Quantity
                                        </label>
                                        <input type="number" 
                                               id="quantity" 
                                               name="quantity" 
                                               min="1"
                                               placeholder="e.g., 100"
                                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                    </div>

                                    <!-- Max Price -->
                                    <div>
                                        <label for="max_price_per_unit" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Max Price per Unit
                                        </label>
                                        <input type="number" 
                                               id="max_price_per_unit" 
                                               name="max_price_per_unit" 
                                               min="0" 
                                               step="0.01"
                                               placeholder="e.g., 25.50"
                                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                    </div>

                                    <!-- Frequency -->
                                    <div>
                                        <label for="frequency" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Purchase Frequency
                                        </label>
                                        <select id="frequency" 
                                                name="frequency" 
                                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                            <option value="">Select frequency</option>
                                            <option value="weekly">Weekly</option>
                                            <option value="monthly">Monthly</option>
                                            <option value="quarterly">Quarterly</option>
                                            <option value="yearly">Yearly</option>
                                            <option value="as_needed">As Needed</option>
                                        </select>
                                    </div>

                                    <!-- Quality Preference -->
                                    <div>
                                        <label for="quality_preference" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Quality Preference
                                        </label>
                                        <select id="quality_preference" 
                                                name="quality_preference" 
                                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                            <option value="">Select quality</option>
                                            <option value="premium">Premium</option>
                                            <option value="standard">Standard</option>
                                            <option value="budget">Budget</option>
                                        </select>
                                    </div>

                                    <!-- Payment Preference -->
                                    <div>
                                        <label for="payment_preference" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Payment Preference
                                        </label>
                                        <select id="payment_preference" 
                                                name="payment_preference" 
                                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                            <option value="">Select payment</option>
                                            <option value="cash">Cash</option>
                                            <option value="credit">Credit</option>
                                            <option value="net30">Net 30</option>
                                            <option value="net60">Net 60</option>
                                            <option value="bank_transfer">Bank Transfer</option>
                                        </select>
                                    </div>

                                    <!-- Delivery Time -->
                                    <div>
                                        <label for="preferred_delivery_time" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Preferred Delivery Time
                                        </label>
                                        <select id="preferred_delivery_time" 
                                                name="preferred_delivery_time" 
                                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                            <option value="">Select delivery time</option>
                                            <option value="urgent">Urgent (1-2 days)</option>
                                            <option value="standard">Standard (3-7 days)</option>
                                            <option value="flexible">Flexible (1-2 weeks)</option>
                                        </select>
                                    </div>

                                    <!-- Typical Order Size -->
                                    <div>
                                        <label for="typical_order_size" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Typical Order Size
                                        </label>
                                        <input type="number" 
                                               id="typical_order_size" 
                                               name="typical_order_size" 
                                               min="1"
                                               placeholder="e.g., 500"
                                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                    </div>

                                    <!-- Preferred Suppliers -->
                                    <div class="md:col-span-2">
                                        <label for="preferred_suppliers" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Preferred Suppliers
                                        </label>
                                        <input type="text" 
                                               id="preferred_suppliers" 
                                               name="preferred_suppliers" 
                                               placeholder="e.g., Supplier A, Supplier B (comma separated)"
                                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                    </div>

                                    <!-- Product Description -->
                                    <div class="md:col-span-2">
                                        <label for="product_description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            Product Description
                                        </label>
                                        <textarea id="product_description" 
                                                  name="product_description" 
                                                  rows="3"
                                                  placeholder="Describe the product, specifications, or any special requirements..."
                                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white"></textarea>
                                    </div>
                                </div>

                                <div class="flex gap-3 pt-4">
                                    <button type="submit" class="inline-flex items-center gap-2 px-6 py-3 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 transition-colors">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                        </svg>
                                        Add Preference
                                    </button>
                                    <a href="/purchase_preferences" class="inline-flex items-center gap-2 px-6 py-3 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors dark:text-gray-400 dark:bg-gray-700 dark:hover:bg-gray-600">
                                        Cancel
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
            <!-- ===== Main Content End ===== -->
        </div>
        <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script src="{{ url_for('static', filename='js/script_1.js') }}"></script>
</body>
</html>
