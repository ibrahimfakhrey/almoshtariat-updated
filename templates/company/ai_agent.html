<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" name="viewport"/>
    <meta content="ie=edge" http-equiv="X-UA-Compatible"/>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>الوكيل الذكي | لوحة تحكم الشركة</title>
    <link href="favicon.ico" rel="icon"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_0.css') }}">
    <script>
        function aiAgentApp() {
            return {
                tasks: JSON.parse(localStorage.getItem('ai_agent_tasks')) || [],
                taskTypes: [
                    { id: 'content_creation', name: 'إنشاء المحتوى', description: 'إنشاء محتوى تسويقي وإبداعي' },
                    { id: 'data_analysis', name: 'تحليل البيانات', description: 'تحليل البيانات واستخراج الرؤى' },
                    { id: 'customer_service', name: 'خدمة العملاء', description: 'الرد على استفسارات العملاء' },
                    { id: 'market_research', name: 'بحث السوق', description: 'دراسة السوق والمنافسين' },
                    { id: 'social_media', name: 'وسائل التواصل', description: 'إدارة وسائل التواصل الاجتماعي' },
                    { id: 'bill_management', name: 'إدارة الفواتير', description: 'إدارة ومتابعة الفواتير والمدفوعات' }
                ],
                newTask: {
                    task_type: '',
                    description: '',
                    priority: 'medium',
                    parameters: {}
                },
                isLoading: false,
                isCreatingTask: false,
                selectedTask: null,
                showTaskModal: false,
                showCreateModal: false,
                page: 'ai_agent',
                loaded: true,
                darkMode: JSON.parse(localStorage.getItem('ai_agent_dark_mode')) || false,
                selected: 'AI Agent',
                stickyMenu: false,
                sidebarToggle: false,
                scrollTop: false,
                isMobile: false,
                
                async init() {
                    // Load data if not already persisted
                    if (this.taskTypes.length === 0) {
                        await this.loadTaskTypes();
                    }
                    if (this.tasks.length === 0) {
                        await this.loadTasks();
                    }
                },
                
                async loadTaskTypes() {
                    try {
                        const response = await fetch('/api/ai_agent/task_types?language=ar');
                        const data = await response.json();
                        if (data.task_types) {
                            this.taskTypes = data.task_types;
                            this.saveTaskTypes();
                        }
                    } catch (error) {
                        console.error('Error loading task types:', error);
                    }
                },
                
                async loadTasks() {
                    try {
                        this.isLoading = true;
                        const response = await fetch('/api/ai_agent/tasks');
                        const data = await response.json();
                        if (data.tasks) {
                            this.tasks = data.tasks;
                            this.saveTasks();
                        }
                    } catch (error) {
                        console.error('Error loading tasks:', error);
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                async refreshData() {
                    await this.loadTaskTypes();
                    await this.loadTasks();
                },
                
                saveTasks() {
                    localStorage.setItem('ai_agent_tasks', JSON.stringify(this.tasks));
                },
                
                saveTaskTypes() {
                    localStorage.setItem('ai_agent_task_types', JSON.stringify(this.taskTypes));
                },
                
                saveDarkMode() {
                    localStorage.setItem('ai_agent_dark_mode', JSON.stringify(this.darkMode));
                },
                
                async createTask() {
                    if (!this.newTask.title || !this.newTask.type) {
                        alert('يرجى ملء جميع الحقول المطلوبة');
                        return;
                    }
                    
                    try {
                        const response = await fetch('/api/ai_agent/tasks', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                title: this.newTask.title,
                                description: this.newTask.description,
                                task_type: this.newTask.type,
                                priority: this.newTask.priority
                            })
                        });
                        
                        if (response.ok) {
                            const task = await response.json();
                            this.tasks.unshift(task);
                            this.saveTasks();
                            
                            // Reset form
                            this.newTask = {
                                title: '',
                                description: '',
                                type: '',
                                priority: 'medium'
                            };
                            this.showTaskForm = false;
                            
                            alert('تم إنشاء المهمة بنجاح!');
                        } else {
                            throw new Error('فشل في إنشاء المهمة');
                        }
                    } catch (error) {
                        console.error('Error creating task:', error);
                        alert('حدث خطأ أثناء إنشاء المهمة');
                    }
                },
                
                async executeTask(taskId) {
                    if (!confirm('هل أنت متأكد من تنفيذ هذه المهمة؟')) {
                        return;
                    }
                    
                    try {
                        const response = await fetch(`/api/ai_agent/tasks/${taskId}/execute`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': document.querySelector('meta[name=csrf-token]').getAttribute('content')
                            }
                        });
                        
                        const data = await response.json();
                        if (data.success) {
                            await this.loadTasks();
                            alert('تم تنفيذ المهمة بنجاح!');
                        } else {
                            alert(data.error || 'حدث خطأ أثناء تنفيذ المهمة');
                        }
                    } catch (error) {
                        console.error('Error executing task:', error);
                        alert('حدث خطأ أثناء تنفيذ المهمة');
                    }
                },
                
                async viewTaskDetails(taskId) {
                    try {
                        const response = await fetch(`/api/ai_agent/tasks/${taskId}/status`);
                        const data = await response.json();
                        if (!data.error) {
                            this.selectedTask = data;
                            this.showTaskModal = true;
                        }
                    } catch (error) {
                        console.error('Error loading task details:', error);
                    }
                },
                
                resetNewTask() {
                    this.newTask = {
                        task_type: '',
                        description: '',
                        priority: 'medium',
                        parameters: {}
                    };
                },
                
                getStatusColor(status) {
                    switch (status) {
                        case 'pending': return 'bg-yellow-100 text-yellow-800';
                        case 'running': return 'bg-blue-100 text-blue-800';
                        case 'completed': return 'bg-green-100 text-green-800';
                        case 'failed': return 'bg-red-100 text-red-800';
                        default: return 'bg-gray-100 text-gray-800';
                    }
                },
                
                getStatusText(status) {
                    switch (status) {
                        case 'pending': return 'في الانتظار';
                        case 'running': return 'قيد التنفيذ';
                        case 'completed': return 'مكتملة';
                        case 'failed': return 'فشلت';
                        default: return status;
                    }
                },
                
                getPriorityColor(priority) {
                    switch (priority) {
                        case 'high': return 'text-red-600';
                        case 'medium': return 'text-yellow-600';
                        case 'low': return 'text-green-600';
                        default: return 'text-gray-600';
                    }
                },
                
                getPriorityText(priority) {
                    switch (priority) {
                        case 'high': return 'عالية';
                        case 'medium': return 'متوسطة';
                        case 'low': return 'منخفضة';
                        default: return priority;
                    }
                },
                
                formatDate(dateString) {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('ar-EG', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            }
        }
    </script>
</head>

                            <label :class="darkMode ? 'bg-primary' : 'bg-stroke'" @click="darkMode = !darkMode" class="relative m-0 block h-7.5 w-14 rounded-full">

            <main class="flex-1 overflow-y-auto p-4 md:p-6 2xl:p-10">
                <div class="mx-auto max-w-7xl">
                    <!-- Page Header -->
                    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                        <div>
                            <h2 class="text-title-md2 font-semibold text-black dark:text-white">الوكيل الذكي</h2>
                            <p class="text-sm text-gray-600 dark:text-gray-400">إنشاء وإدارة المهام الذكية لتحسين عمليات شركتك</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button @click="refreshData()" :disabled="isLoading" class="inline-flex items-center justify-center rounded-md border border-stroke bg-white px-4 py-2 text-center font-medium text-black hover:bg-gray-50 disabled:opacity-50 dark:border-strokedark dark:bg-boxdark dark:text-white dark:hover:bg-gray-800">
                                <svg class="ml-2 h-4 w-4" :class="isLoading ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                                تحديث
                            </button>
                            <button @click="showCreateModal = true" class="inline-flex items-center justify-center rounded-md bg-primary px-6 py-3 text-center font-medium text-white hover:bg-opacity-90">
                                <svg class="ml-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                </svg>
                                إنشاء مهمة جديدة
                            </button>
                        </div>
                    </div>
                    
                    <!-- Tasks Grid -->
                    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
                        <!-- Loading State -->
                        <template x-show="isLoading">
                            <div class="col-span-full flex items-center justify-center py-12">
                                <div class="flex items-center gap-3">
                                    <svg class="h-6 w-6 animate-spin text-primary" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    <span class="text-gray-600 dark:text-gray-400">جاري تحميل المهام...</span>
                                </div>
                            </div>
                        </template>
                        
                        <!-- Empty State -->
                        <template x-show="!isLoading && tasks.length === 0">
                            <div class="col-span-full flex flex-col items-center justify-center py-12">
                                <svg class="h-16 w-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                                </svg>
                                <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">لا توجد مهام حتى الآن</h3>

                                    إنشاء مهمة جديدة
                                </button>
                            </div>
                        </template>
                        
                        <!-- Task Cards -->
                        <template x-for="task in tasks" :key="task.id">
                            <div class="rounded-sm border border-stroke bg-white p-6 shadow-default dark:border-strokedark dark:bg-boxdark">
                                <div class="flex items-start justify-between mb-4">
                                    <div class="flex-1">
                                        <h3 class="text-lg font-semibold text-black dark:text-white mb-2" x-text="task.description"></h3>
                                        <div class="flex items-center gap-2 mb-2">
                                            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium" :class="getStatusColor(task.status)" x-text="getStatusText(task.status)"></span>
                                            <span class="text-xs font-medium" :class="getPriorityColor(task.priority)" x-text="getPriorityText(task.priority)"></span>
                                        </div>
                                        <p class="text-sm text-gray-600 dark:text-gray-400" x-text="task.task_type"></p>
                                    </div>
                                </div>
                                
                                <div class="mb-4">
                                    <p class="text-xs text-gray-500 dark:text-gray-400" x-text="'تم الإنشاء: ' + formatDate(task.created_at)"></p>
                                    <p x-show="task.completed_at" class="text-xs text-gray-500 dark:text-gray-400" x-text="'تم الإكمال: ' + formatDate(task.completed_at)"></p>
                                </div>
                                
                                <div class="flex items-center gap-2">
                                    <button @click="viewTaskDetails(task.id)" class="flex-1 rounded bg-gray-100 px-3 py-2 text-xs font-medium text-gray-700 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
                                        عرض التفاصيل
                                    </button>
                                    <button x-show="task.status === 'pending'" @click="executeTask(task.id)" class="flex-1 rounded bg-primary px-3 py-2 text-xs font-medium text-white hover:bg-opacity-90">
                                        تنفيذ
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </main>
            <!-- ===== Main Content End ===== -->
        </div>
        <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
    
    <!-- Create Task Modal -->
    <div x-show="showCreateModal" class="fixed inset-0 z-99999 flex items-center justify-center bg-black bg-opacity-50">
        <div class="mx-4 w-full max-w-md rounded-lg bg-white p-6 dark:bg-boxdark">
            <div class="mb-4 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-black dark:text-white">إنشاء مهمة جديدة</h3>
                <button @click="showCreateModal = false" class="text-gray-400 hover:text-gray-600">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form @submit.prevent="createTask()">
                <div class="mb-4">
                    <label class="mb-2 block text-sm font-medium text-black dark:text-white">نوع المهمة</label>
                    <select x-model="newTask.task_type" class="w-full rounded border border-stroke bg-gray px-4 py-3 text-black focus:border-primary focus:outline-none dark:border-strokedark dark:bg-meta-4 dark:text-white" required>
                        <option value="">اختر نوع المهمة</option>
                        <template x-for="taskType in taskTypes" :key="taskType.id">
                            <option :value="taskType.id" x-text="taskType.name"></option>
                        </template>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="mb-2 block text-sm font-medium text-black dark:text-white">وصف المهمة</label>
                    <textarea x-model="newTask.description" rows="3" class="w-full rounded border border-stroke bg-gray px-4 py-3 text-black focus:border-primary focus:outline-none dark:border-strokedark dark:bg-meta-4 dark:text-white" placeholder="اكتب وصفاً مفصلاً للمهمة..." required></textarea>
                </div>
                
                <div class="mb-6">
                    <label class="mb-2 block text-sm font-medium text-black dark:text-white">الأولوية</label>
                    <select x-model="newTask.priority" class="w-full rounded border border-stroke bg-gray px-4 py-3 text-black focus:border-primary focus:outline-none dark:border-strokedark dark:bg-meta-4 dark:text-white">
                        <option value="low">منخفضة</option>
                        <option value="medium">متوسطة</option>
                        <option value="high">عالية</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-3">
                    <button type="submit" :disabled="isCreatingTask" class="flex-1 rounded bg-primary px-4 py-3 text-center font-medium text-white hover:bg-opacity-90 disabled:opacity-50">
                        <span x-show="!isCreatingTask">إنشاء المهمة</span>
                        <span x-show="isCreatingTask" class="flex items-center justify-center gap-2">
                            <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            جاري الإنشاء...
                        </span>
                    </button>
                    <button type="button" @click="showCreateModal = false" class="rounded border border-stroke px-4 py-3 text-center font-medium text-black hover:bg-gray dark:border-strokedark dark:text-white">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Task Details Modal -->
    <div x-show="showTaskModal" class="fixed inset-0 z-99999 flex items-center justify-center bg-black bg-opacity-50">
        <div class="mx-4 w-full max-w-2xl rounded-lg bg-white p-6 dark:bg-boxdark">
            <div class="mb-4 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-black dark:text-white">تفاصيل المهمة</h3>
                <button @click="showTaskModal = false" class="text-gray-400 hover:text-gray-600">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <template x-if="selectedTask">
                <div>
                    <div class="mb-4">
                        <h4 class="text-md font-medium text-black dark:text-white mb-2" x-text="selectedTask.description"></h4>
                        <div class="flex items-center gap-4 mb-4">
                            <span class="inline-flex items-center rounded-full px-3 py-1 text-sm font-medium" :class="getStatusColor(selectedTask.status)" x-text="getStatusText(selectedTask.status)"></span>
                            <span class="text-sm font-medium" :class="getPriorityColor(selectedTask.priority)" x-text="'الأولوية: ' + getPriorityText(selectedTask.priority)"></span>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <h5 class="text-sm font-medium text-black dark:text-white mb-2">معلومات المهمة</h5>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="text-gray-600 dark:text-gray-400">نوع المهمة:</span>
                                <span class="text-black dark:text-white" x-text="selectedTask.task_type"></span>
                            </div>
                            <div>
                                <span class="text-gray-600 dark:text-gray-400">تاريخ الإنشاء:</span>
                                <span class="text-black dark:text-white" x-text="formatDate(selectedTask.created_at)"></span>
                            </div>
                            <div x-show="selectedTask.started_at">
                                <span class="text-gray-600 dark:text-gray-400">تاريخ البدء:</span>
                                <span class="text-black dark:text-white" x-text="formatDate(selectedTask.started_at)"></span>
                            </div>
                            <div x-show="selectedTask.completed_at">
                                <span class="text-gray-600 dark:text-gray-400">تاريخ الإكمال:</span>
                                <span class="text-black dark:text-white" x-text="formatDate(selectedTask.completed_at)"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div x-show="selectedTask.result" class="mb-4">
                        <h5 class="text-sm font-medium text-black dark:text-white mb-2">نتيجة المهمة</h5>
                        <div class="rounded border border-stroke bg-gray-50 p-3 dark:border-strokedark dark:bg-gray-800">
                            <p class="text-sm text-black dark:text-white" x-text="selectedTask.result"></p>
                        </div>
                    </div>
                    
                    <div x-show="selectedTask.error" class="mb-4">
                        <h5 class="text-sm font-medium text-red-600 mb-2">خطأ في التنفيذ</h5>
                        <div class="rounded border border-red-200 bg-red-50 p-3 dark:border-red-800 dark:bg-red-900">
                            <p class="text-sm text-red-800 dark:text-red-200" x-text="selectedTask.error"></p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <button x-show="selectedTask.status === 'pending'" @click="executeTask(selectedTask.id); showTaskModal = false" class="rounded bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-opacity-90">
                            تنفيذ المهمة
                        </button>
                        <button @click="showTaskModal = false" class="rounded border border-stroke px-4 py-2 text-sm font-medium text-black hover:bg-gray dark:border-strokedark dark:text-white">
                            إغلاق
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</body>
</html>
